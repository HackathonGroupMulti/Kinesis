<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t">
  <title id="t">Kinesis mark</title>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="7" cy="7" r="3.2" fill="#FF2D3D"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dotmask"><rect width="400" height="400" fill="url(#fade)"/></mask>
  </defs>

  <!-- slanted badge -->
  <polygon points="96,24 384,24 304,376 16,376" fill="#0A0A0F"/>
  <polygon points="96,24 384,24 304,376 16,376" fill="url(#dots)" mask="url(#dotmask)"/>
  <polygon points="96,24 384,24 304,376 16,376" fill="none" stroke="#FFFFFF" stroke-width="6"/>

  <!-- speed lines -->
  <g stroke="#FF2D3D" stroke-width="6" stroke-linecap="round">
    <line x1="58" y1="108" x2="120" y2="108"/>
    <line x1="44" y1="140" x2="92" y2="140"/>
    <line x1="34" y1="290" x2="96" y2="290"/>
    <line x1="26" y1="322" x2="66" y2="322"/>
  </g>

  <!-- the X: white = the sliding motion, red = the repaired motion -->
  <polygon points="110,62 176,62 318,338 236,338" fill="#FFFFFF"/>
  <polygon points="300,52 368,52 150,348 70,348" fill="#FF2D3D" stroke="#0A0A0F" stroke-width="8" stroke-linejoin="miter"/>
  <polygon points="300,52 368,52 150,348 70,348" fill="none" stroke="#FFFFFF" stroke-width="3"/>

  <!-- locked contact point -->
  <polygon points="216,158 258,200 216,242 174,200" fill="#FFD60A" stroke="#0A0A0F" stroke-width="9"/>
  <polygon points="216,184 232,200 216,216 200,200" fill="#0A0A0F"/>
</svg>
